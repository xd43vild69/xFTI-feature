[project]
name = "fti-agent"
version = "0.1.0"
description = "MCP Host agent for Feature Pipeline Hub's LoRA curation pipeline"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "mcp>=1.9,<2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fti_agent"]

[project.scripts]
fti-agent = "fti_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
files = ["src/fti_agent"]
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
