<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { --fg: #1f2937; --bg: #f9fafb; --accent: #3b82f6; --success: #10b981; --warn: #f59e0b; }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #f3f4f6; --bg: #111827; --accent: #60a5fa; --success: #34d399; --warn: #fbbf24; }
      }
      .box { stroke: #3b82f6; stroke-width: 2; fill: #f9fafb; }
      .label { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2937; }
      .sublabel { font-family: -apple-system, sans-serif; font-size: 11px; fill: #1f2937; opacity: 0.8; }
      .arrow { stroke: #3b82f6; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .utility { stroke: #10b981; }
      .state { stroke: #f59e0b; }
      #arrowhead { fill: #3b82f6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="500" y="30" class="label" text-anchor="middle" font-size="16">ARQUITECTURA DEL ENTRENAMIENTO: train_krea2()</text>

  <!-- FASE 1: Setup Inicial -->
  <g>
    <text x="50" y="70" class="sublabel" font-weight="bold">FASE 1: Setup Inicial (líneas 403-514)</text>

    <!-- Config -->
    <rect x="50" y="90" width="140" height="50" class="box"/>
    <text x="120" y="110" class="label" text-anchor="middle">config.load_config()</text>
    <text x="120" y="130" class="sublabel" text-anchor="middle">→ TrainConfig (frozen)</text>

    <!-- Model Download -->
    <rect x="220" y="90" width="140" height="50" class="box"/>
    <text x="290" y="110" class="label" text-anchor="middle">Descargar Modelo</text>
    <text x="290" y="130" class="sublabel" text-anchor="middle">Krea-2-NF4</text>

    <!-- Quantization -->
    <rect x="390" y="90" width="140" height="50" class="box"/>
    <text x="460" y="110" class="label" text-anchor="middle">Cuantizar NF4</text>
    <text x="460" y="130" class="sublabel" text-anchor="middle">o cargar caché</text>

    <!-- LoRA Setup -->
    <rect x="560" y="90" width="140" height="50" class="box"/>
    <text x="630" y="110" class="label" text-anchor="middle">Attach LoRA</text>
    <text x="630" y="130" class="sublabel" text-anchor="middle">+ Optimizer</text>

    <path class="arrow" d="M 190 115 L 220 115"/>
    <path class="arrow" d="M 360 115 L 390 115"/>
    <path class="arrow" d="M 530 115 L 560 115"/>
  </g>

  <!-- FASE 2: Cargar Datos -->
  <g>
    <text x="50" y="200" class="sublabel" font-weight="bold">FASE 2: Cargar Datos en RAM (líneas 515-594)</text>

    <!-- Checkpoint Restore -->
    <rect x="50" y="220" width="160" height="60" class="box state"/>
    <text x="130" y="240" class="label" text-anchor="middle">CheckpointManager</text>
    <text x="130" y="260" class="sublabel" text-anchor="middle">Restaurar o comenzar</text>

    <!-- Dataset Load -->
    <rect x="250" y="220" width="160" height="60" class="box utility"/>
    <text x="330" y="240" class="label" text-anchor="middle">dataset.load()</text>
    <text x="330" y="260" class="sublabel" text-anchor="middle">Latents + embeddings</text>

    <!-- Curation Weights -->
    <rect x="450" y="220" width="160" height="60" class="box utility"/>
    <text x="530" y="240" class="label" text-anchor="middle">curation.load_weights()</text>
    <text x="530" y="260" class="sublabel" text-anchor="middle">Pesos por imagen</text>

    <!-- Sampler Build -->
    <rect x="650" y="220" width="160" height="60" class="box utility"/>
    <text x="730" y="240" class="label" text-anchor="middle">sampling.build_sampler()</text>
    <text x="730" y="260" class="sublabel" text-anchor="middle">EpochSampler o Legacy</text>

    <path class="arrow" d="M 210 250 L 250 250"/>
    <path class="arrow" d="M 410 250 L 450 250"/>
    <path class="arrow" d="M 610 250 L 650 250"/>
  </g>

  <!-- FASE 3: Loop Principal -->
  <g>
    <text x="50" y="330" class="sublabel" font-weight="bold">FASE 3: Loop de Entrenamiento (líneas 674-909)</text>

    <!-- Loop Box Outer -->
    <rect x="40" y="350" width="920" height="520" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="50" y="365" class="sublabel">for step in 1..TOTAL_STEPS:</text>

    <!-- Step 1: Sampler -->
    <rect x="60" y="380" width="140" height="60" class="box utility"/>
    <text x="130" y="400" class="label" text-anchor="middle">sampler.next()</text>
    <text x="130" y="420" class="sublabel" text-anchor="middle">batch de imágenes</text>

    <!-- Step 2: Sigma Sample -->
    <rect x="230" y="380" width="140" height="60" class="box utility"/>
    <text x="300" y="400" class="label" text-anchor="middle">math_ops.sample_sigma()</text>
    <text x="300" y="420" class="sublabel" text-anchor="middle">σ ∈ [0, 1]</text>

    <!-- Step 3: Forward Pass -->
    <rect x="400" y="380" width="140" height="60" class="box"/>
    <text x="470" y="400" class="label" text-anchor="middle">Ruido + Forward</text>
    <text x="470" y="420" class="sublabel" text-anchor="middle">x_noisy → pred</text>

    <!-- Step 4: Loss -->
    <rect x="570" y="380" width="140" height="60" class="box"/>
    <text x="640" y="400" class="label" text-anchor="middle">Calcular Loss</text>
    <text x="640" y="420" class="sublabel" text-anchor="middle">MSE + pesos</text>

    <!-- Step 5: Backward -->
    <rect x="740" y="380" width="140" height="60" class="box"/>
    <text x="810" y="400" class="label" text-anchor="middle">Backward</text>
    <text x="810" y="420" class="sublabel" text-anchor="middle">Acumular gradients</text>

    <path class="arrow" d="M 200 410 L 230 410"/>
    <path class="arrow" d="M 370 410 L 400 410"/>
    <path class="arrow" d="M 540 410 L 570 410"/>
    <path class="arrow" d="M 710 410 L 740 410"/>

    <!-- Accumulation Decision -->
    <text x="60" y="480" class="sublabel" font-weight="bold">¿accum_count >= GRAD_ACCUM_STEPS?</text>

    <!-- Optimizer Step -->
    <rect x="60" y="500" width="200" height="80" class="box"/>
    <text x="160" y="520" class="label" text-anchor="middle">Optimizer Step</text>
    <text x="160" y="540" class="sublabel" text-anchor="middle">clip_grad_norm_</text>
    <text x="160" y="560" class="sublabel" text-anchor="middle">lr_at(step)</text>
    <text x="160" y="580" class="sublabel" text-anchor="middle">optimizer.step()</text>

    <!-- EMA Update -->
    <rect x="300" y="500" width="200" height="80" class="box utility"/>
    <text x="400" y="520" class="label" text-anchor="middle">EMA Update</text>
    <text x="400" y="540" class="sublabel" text-anchor="middle">(si USE_EMA)</text>
    <text x="400" y="560" class="sublabel" text-anchor="middle">ema.update()</text>

    <!-- Checkpoint -->
    <rect x="540" y="500" width="200" height="80" class="box state"/>
    <text x="640" y="520" class="label" text-anchor="middle">Checkpoint</text>
    <text x="640" y="540" class="sublabel" text-anchor="middle">(cada SAVE_EVERY)</text>
    <text x="640" y="560" class="sublabel" text-anchor="middle">state_dict()</text>

    <!-- Validation & Preview -->
    <rect x="780" y="500" width="160" height="80" class="box"/>
    <text x="860" y="520" class="label" text-anchor="middle">Validación</text>
    <text x="860" y="540" class="sublabel" text-anchor="middle">&amp; Preview</text>
    <text x="860" y="560" class="sublabel" text-anchor="middle">(periódico)</text>

    <!-- Logging -->
    <rect x="60" y="610" width="880" height="50" class="box utility"/>
    <text x="500" y="630" class="label" text-anchor="middle">Logging: metrics.CsvLogs + print progress</text>

    <!-- Guards & Metrics -->
    <text x="60" y="700" class="sublabel" font-weight="bold">Guardias &amp; Métricas (inline):</text>
    <text x="80" y="720" class="sublabel">• NAN_GUARD: detectar non-finite → skip batch</text>
    <text x="80" y="735" class="sublabel">• OOM_GUARD: torch.cuda.OutOfMemoryError → retry/abort</text>
    <text x="80" y="750" class="sublabel">• max_loss: outlier detection → discard window</text>
    <text x="80" y="765" class="sublabel">• timestep_weight: ponderar steps (bell/half_bell)</text>
    <text x="80" y="780" class="sublabel">• curation_w: escalar loss por imagen</text>
  </g>

  <!-- FASE 4: Finalización -->
  <g>
    <text x="50" y="920" class="sublabel" font-weight="bold">FASE 4: Finalización (líneas 889-912)</text>

    <!-- Flush Accum -->
    <rect x="50" y="940" width="160" height="60" class="box"/>
    <text x="130" y="960" class="label" text-anchor="middle">Flush Partial Accum</text>
    <text x="130" y="980" class="sublabel" text-anchor="middle">última ventana</text>

    <!-- Final Checkpoint -->
    <rect x="250" y="940" width="160" height="60" class="box state"/>
    <text x="330" y="960" class="label" text-anchor="middle">Final Checkpoint</text>
    <text x="330" y="980" class="sublabel" text-anchor="middle">save + hand-off</text>

    <!-- Export Final -->
    <rect x="450" y="940" width="160" height="60" class="box"/>
    <text x="530" y="960" class="label" text-anchor="middle">Export Final LoRA</text>
    <text x="530" y="980" class="sublabel" text-anchor="middle">Krea2_FINAL_LoRA</text>

    <!-- Telemetry -->
    <rect x="650" y="940" width="160" height="60" class="box"/>
    <text x="730" y="960" class="label" text-anchor="middle">Telemetry</text>
    <text x="730" y="980" class="sublabel" text-anchor="middle">worker_finished</text>

    <path class="arrow" d="M 210 970 L 250 970"/>
    <path class="arrow" d="M 410 970 L 450 970"/>
    <path class="arrow" d="M 610 970 L 650 970"/>
  </g>

  <!-- Legend -->
  <g>
    <text x="50" y="1080" class="sublabel" font-weight="bold">Colores:</text>
    <rect x="50" y="1090" width="15" height="15" class="box"/>
    <text x="75" y="1100" class="sublabel">Lógica core</text>

    <rect x="250" y="1090" width="15" height="15" class="box utility"/>
    <text x="275" y="1100" class="sublabel">Utilidades (krea2/)</text>

    <rect x="500" y="1090" width="15" height="15" class="box state"/>
    <text x="525" y="1100" class="sublabel">Estado/Checkpoints</text>
  </g>

  <!-- Info -->
  <text x="50" y="1150" class="sublabel">Entrypoint: train_worker.py:391 | Total ~450 líneas | Duración típica: 30min-12h según TOTAL_STEPS</text>
</svg>