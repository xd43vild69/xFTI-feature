# CI for the Feature Pipeline Hub app, which lives in feature_pipeline_hub/ and is
# managed with uv (see feature_pipeline_hub/pyproject.toml), not pip/requirements.txt.
# Runs the pytest suite (unit tests covering caption/validation/export logic and the
# MCP tools) and a strict mypy pass (Pydantic-aware, via the pydantic.mypy plugin) on
# every push and pull request to main, so no change can land without both passing.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: feature_pipeline_hub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: feature_pipeline_hub/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Type-check with mypy
        run: uv run mypy

      - name: Test with pytest
        run: uv run pytest
