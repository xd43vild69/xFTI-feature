[project]
name = "feature-pipeline"
version = "0.1.0"
description = "FTI Feature Pipeline Hub - dataset curation for LoRA training"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.0",
    "imagehash>=4.3",
    "numpy>=1.26",
    "streamlit>=1.35",
    "mcp>=1.9,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
# workers/ is otherwise out of scope (ported from upstream, and the training-runtime
# modules import torch, which this environment does not have). The krea2 modules listed
# here are the torch-free ones, so they type-check and get tested like the rest of the
# codebase; anything under workers/krea2/ that imports torch stays off this list.
files = [
    "src/feature_pipeline",
    "mcp_server",
    "workers/krea2/__init__.py",
    "workers/krea2/config.py",
    "workers/krea2/curation.py",
    "workers/krea2/sampling.py",
    "workers/krea2/checkpoints.py",
]
mypy_path = "workers"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "imagehash.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
