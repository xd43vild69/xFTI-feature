[project]
name = "feature-pipeline"
version = "0.1.0"
description = "FTI Feature Pipeline Hub - dataset curation for LoRA training"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.0",
    "imagehash>=4.3",
    "streamlit>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
